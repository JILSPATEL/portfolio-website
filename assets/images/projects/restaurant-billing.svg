<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad4)"/>

  <g stroke="rgba(244, 63, 94, 0.08)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <circle cx="200" cy="150" r="140" fill="#f43f5e" opacity="0.1" filter="url(#glow4)"/>
  <circle cx="620" cy="280" r="130" fill="#38bdf8" opacity="0.1" filter="url(#glow4)"/>

  <!-- Main POS Window -->
  <rect x="70" y="55" width="660" height="340" rx="16" fill="#0f172a" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="70" y="55" width="660" height="44" rx="16" fill="#020617"/>
  <circle cx="98" cy="77" r="5.5" fill="#ef4444"/>
  <circle cx="118" cy="77" r="5.5" fill="#f59e0b"/>
  <circle cx="138" cy="77" r="5.5" fill="#10b981"/>
  <text x="165" y="82" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="13">restaurant_pos/main.py • Tkinter GUI + MySQL Engine</text>

  <!-- Left: POS Cart & Menu -->
  <g transform="translate(100, 125)">
    <rect width="280" height="195" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <text x="16" y="28" fill="#fda4af" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">ORDER CART &amp; BILL GENERATOR</text>
    
    <g transform="translate(16, 45)">
      <rect width="248" height="26" rx="4" fill="#0f172a"/>
      <text x="10" y="18" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">Item #1: Supreme Meal x2</text>
      <text x="210" y="18" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11">$24.00</text>
      
      <rect y="32" width="248" height="26" rx="4" fill="#0f172a"/>
      <text x="10" y="50" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">Item #2: Cold Brew x2</text>
      <text x="210" y="50" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11">$08.50</text>

      <rect y="64" width="248" height="26" rx="4" fill="#0f172a"/>
      <text x="10" y="82" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">Tax + Service (10%)</text>
      <text x="210" y="82" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">$03.25</text>
    </g>

    <line x1="16" y1="148" x2="264" y2="148" stroke="#334155" stroke-width="1"/>
    <text x="16" y="172" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Total: $35.75</text>
    <rect x="180" y="156" width="84" height="24" rx="4" fill="#f43f5e"/>
    <text x="222" y="172" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">PRINT INVOICE</text>
  </g>

  <!-- Right: MySQL Analytics & Summary -->
  <g transform="translate(400, 125)">
    <rect width="295" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="16" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">MYSQL RELATIONAL STORAGE</text>
    <text x="16" y="48" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">TABLE orders (id, date, total, status)</text>
    <text x="16" y="66" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10">✓ Automated daily ledger backup</text>

    <g transform="translate(0, 105)">
      <rect width="295" height="90" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
      <text x="16" y="26" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">REAL-TIME KPIS</text>
      <text x="16" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">100% Offline Capable</text>
      <text x="16" y="75" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Zero cloud latency • Instant invoice generation</text>
    </g>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(100, 345)">
    <rect width="80" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="40" y="16" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">PYTHON</text>
    <rect x="90" width="85" height="24" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="132" y="16" fill="#fda4af" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">TKINTER</text>
    <rect x="185" width="80" height="24" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="225" y="16" fill="#fde68a" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">MYSQL</text>
  </g>
</svg>
