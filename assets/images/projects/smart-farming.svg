<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06120d"/>
      <stop offset="50%" stop-color="#0b2416"/>
      <stop offset="100%" stop-color="#020804"/>
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad5)"/>

  <g stroke="rgba(16, 185, 129, 0.08)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <circle cx="200" cy="180" r="140" fill="#10b981" opacity="0.14" filter="url(#glow5)"/>
  <circle cx="650" cy="220" r="130" fill="#06b6d4" opacity="0.12" filter="url(#glow5)"/>

  <!-- Main Window -->
  <rect x="70" y="55" width="660" height="340" rx="16" fill="#061912" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="70" y="55" width="660" height="44" rx="16" fill="#030d09"/>
  <circle cx="98" cy="77" r="5.5" fill="#ef4444"/>
  <circle cx="118" cy="77" r="5.5" fill="#f59e0b"/>
  <circle cx="138" cy="77" r="5.5" fill="#10b981"/>
  <text x="165" y="82" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="13">models/crop_classifier.py • Scikit-Learn • Random Forest Ensemble</text>

  <!-- Left: Soil Nutrient Feature Vector -->
  <g transform="translate(100, 125)">
    <rect width="275" height="195" rx="10" fill="#0b2416" stroke="#10b981" stroke-width="1.2"/>
    <text x="18" y="28" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">SOIL SENSOR FEATURE MATRIX</text>
    
    <g transform="translate(18, 48)">
      <text x="0" y="15" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Nitrogen (N): 85 kg/ha</text>
      <rect y="22" width="220" height="6" rx="3" fill="#1e293b"/>
      <rect y="22" width="180" height="6" rx="3" fill="#10b981"/>

      <text x="0" y="50" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Phosphorus (P): 48 kg/ha</text>
      <rect y="57" width="220" height="6" rx="3" fill="#1e293b"/>
      <rect y="57" width="130" height="6" rx="3" fill="#06b6d4"/>

      <text x="0" y="85" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Potassium (K): 42 kg/ha</text>
      <rect y="92" width="220" height="6" rx="3" fill="#1e293b"/>
      <rect y="92" width="115" height="6" rx="3" fill="#3b82f6"/>

      <text x="0" y="120" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Soil pH: 6.8 | Humidity: 82%</text>
    </g>
  </g>

  <!-- Right: ML Inference & Prediction -->
  <g transform="translate(395, 125)">
    <rect width="300" height="195" rx="10" fill="#081e13" stroke="#34d399" stroke-width="1.2"/>
    <text x="20" y="30" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">PREDICTIVE RECOMMENDATION</text>
    
    <g transform="translate(20, 50)">
      <rect width="260" height="58" rx="8" fill="#133e24" stroke="#10b981" stroke-width="1.5"/>
      <text x="15" y="25" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="11">OPTIMAL CROP DETECTED</text>
      <text x="15" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">🌾 Golden Rice / Maize</text>
    </g>

    <g transform="translate(20, 122)">
      <rect width="125" height="55" rx="8" fill="#0b2416"/>
      <text x="12" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">MODEL ACCURACY</text>
      <text x="12" y="45" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">~96.2%</text>

      <rect x="135" width="125" height="55" rx="8" fill="#0b2416"/>
      <text x="147" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">INFERENCE TIME</text>
      <text x="147" y="45" fill="#67e8f9" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">&lt; 15ms</text>
    </g>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(100, 345)">
    <rect width="80" height="24" rx="12" fill="#0b2416" stroke="#34d399" stroke-width="1"/>
    <text x="40" y="16" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">PYTHON</text>
    <rect x="90" width="110" height="24" rx="12" fill="#0b2416" stroke="#10b981" stroke-width="1"/>
    <text x="145" y="16" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">SCIKIT-LEARN</text>
    <rect x="210" width="70" height="24" rx="12" fill="#0b2416" stroke="#06b6d4" stroke-width="1"/>
    <text x="245" y="16" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">FLASK</text>
  </g>
</svg>
