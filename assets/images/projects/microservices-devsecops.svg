<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad2)"/>

  <!-- Grid lines -->
  <g stroke="rgba(99, 102, 241, 0.08)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Glows -->
  <circle cx="650" cy="120" r="130" fill="#6366f1" opacity="0.12" filter="url(#glow2)"/>
  <circle cx="150" cy="350" r="140" fill="#10b981" opacity="0.1" filter="url(#glow2)"/>

  <!-- Container Box -->
  <rect x="70" y="55" width="660" height="340" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="70" y="55" width="660" height="44" rx="16" fill="#020617" fill-opacity="0.95"/>
  <circle cx="98" cy="77" r="5.5" fill="#ef4444"/>
  <circle cx="118" cy="77" r="5.5" fill="#f59e0b"/>
  <circle cx="138" cy="77" r="5.5" fill="#10b981"/>
  <text x="165" y="82" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500">k8s-cluster/production • 6 Microservices Active • Trivy Guarded</text>
  <rect x="590" y="67" width="120" height="20" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
  <text x="605" y="81" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">DEVSECOPS LIVE</text>

  <!-- CI/CD Pipeline Flow -->
  <g transform="translate(100, 125)">
    <!-- Stage 1 -->
    <rect width="115" height="75" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="57" y="28" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">BUILD</text>
    <text x="57" y="48" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Docker / Syft</text>
    <text x="57" y="64" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">✓ SBOM Signed</text>

    <!-- Arrow -->
    <path d="M 125 162 L 145 162" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 2 -->
    <g transform="translate(140, 0)">
      <rect width="115" height="75" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
      <text x="57" y="28" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">SECURITY</text>
      <text x="57" y="48" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Trivy Scan</text>
      <text x="57" y="64" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">0 CVE Critical</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(280, 0)">
      <rect width="125" height="75" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
      <text x="62" y="28" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">AUTOMATION</text>
      <text x="62" y="48" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Jenkins + Ansible</text>
      <text x="62" y="64" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Automated CD</text>
    </g>

    <!-- Stage 4 -->
    <g transform="translate(425, 0)">
      <rect width="135" height="75" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="67" y="28" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">ORCHESTRATION</text>
      <text x="67" y="48" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">K8s Deployment</text>
      <text x="67" y="64" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">HPA Autoscaled</text>
    </g>
  </g>

  <!-- Monitoring Dashboard Area -->
  <g transform="translate(100, 225)">
    <rect width="360" height="145" rx="10" fill="#020617" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="18" y="25" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">PROMETHEUS &amp; GRAFANA TELEMETRY</text>
    
    <!-- Mini wave chart -->
    <path d="M 20 100 Q 60 40 100 80 T 180 60 T 260 90 T 340 50" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
    <path d="M 20 100 Q 60 40 100 80 T 180 60 T 260 90 T 340 50 L 340 130 L 20 130 Z" fill="#06b6d4" opacity="0.1"/>
    
    <text x="20" y="125" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10">● 6/6 Pods Healthy</text>
    <text x="180" y="125" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="10">Avg Latency: 14ms</text>
    <text x="300" y="125" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="10">99.98% Up</text>
  </g>

  <!-- Side stats card -->
  <g transform="translate(480, 225)">
    <rect width="215" height="145" rx="10" fill="#020617" stroke="#6366f1" stroke-width="1"/>
    <text x="18" y="30" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="11">SECURITY GATES</text>
    <text x="18" y="62" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800">Cosign + Syft</text>
    <text x="18" y="88" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11">✓ Signed Images</text>
    <text x="18" y="108" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11">✓ SBOM Artifacts</text>
    <text x="18" y="128" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11">✓ GitOps Verified</text>
  </g>
</svg>
