<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0d1b33"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad1)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(59, 130, 246, 0.08)" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="130" fill="#3b82f6" opacity="0.12" filter="url(#glow1)"/>
  <circle cx="650" cy="300" r="140" fill="#06b6d4" opacity="0.1" filter="url(#glow1)"/>

  <!-- Main Architecture Board -->
  <rect x="70" y="55" width="660" height="340" rx="16" fill="url(#cardGrad)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1.5"/>

  <!-- Header Bar -->
  <rect x="70" y="55" width="660" height="44" rx="16" fill="#0f172a" fill-opacity="0.95"/>
  <circle cx="98" cy="77" r="5.5" fill="#ef4444"/>
  <circle cx="118" cy="77" r="5.5" fill="#f59e0b"/>
  <circle cx="138" cy="77" r="5.5" fill="#10b981"/>
  <text x="165" y="82" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500">engine/storage/ColumnarRecordLayout.java • O(1) Index Lookup</text>
  <rect x="610" y="67" width="100" height="20" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="625" y="81" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">QUERY ENGINE</text>

  <!-- Column Storage Diagram -->
  <!-- Col 1 -->
  <g transform="translate(110, 130)">
    <rect width="115" height="200" rx="10" fill="#0a1226" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="115" height="36" rx="10" fill="#0369a1"/>
    <text x="57" y="24" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">col_id</text>
    <text x="57" y="65" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">0x0001</text>
    <text x="57" y="95" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">0x0002</text>
    <text x="57" y="125" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">0x0003</text>
    <text x="57" y="155" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">0x0004</text>
    <text x="57" y="185" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">0x0005</text>
  </g>

  <!-- Col 2 -->
  <g transform="translate(245, 130)">
    <rect width="135" height="200" rx="10" fill="#0a1226" stroke="#818cf8" stroke-width="1.5"/>
    <rect width="135" height="36" rx="10" fill="#4338ca"/>
    <text x="67" y="24" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">dictionary_val</text>
    <text x="67" y="65" fill="#c7d2fe" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">"ACTIVE"</text>
    <text x="67" y="95" fill="#c7d2fe" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">"PENDING"</text>
    <text x="67" y="125" fill="#c7d2fe" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">"ACTIVE"</text>
    <text x="67" y="155" fill="#c7d2fe" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">"CLOSED"</text>
    <text x="67" y="185" fill="#c7d2fe" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">"ACTIVE"</text>
  </g>

  <!-- Right side: Bitmap Indexing & Metrics -->
  <g transform="translate(410, 130)">
    <!-- Bitmap Index Box -->
    <rect width="280" height="90" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.2"/>
    <text x="20" y="30" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">⚡ BITMAP INDEX VECTOR</text>
    <text x="20" y="55" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Filter: status == "ACTIVE"</text>
    <rect x="20" y="63" width="240" height="18" rx="4" fill="#1e293b"/>
    <text x="28" y="77" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">1  0  1  0  1  [BitSet: 3 hits]</text>

    <!-- Metrics Box -->
    <g transform="translate(0, 105)">
      <rect width="135" height="95" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="18" y="30" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="11">ACCESS TIME</text>
      <text x="18" y="65" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800">O(1)</text>
      <text x="18" y="85" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Random Record</text>
    </g>

    <g transform="translate(145, 105)">
      <rect width="135" height="95" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
      <text x="18" y="30" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11">SCAN SPEEDUP</text>
      <text x="18" y="65" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800">8.4x</text>
      <text x="18" y="85" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">BitSet Vectorized</text>
    </g>
  </g>

  <!-- Bottom Floating Badges -->
  <g transform="translate(110, 350)">
    <rect width="85" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="42" y="16" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">JAVA</text>
    
    <rect x="95" width="115" height="24" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
    <text x="152" y="16" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">SQL PARSER</text>
    
    <rect x="220" width="130" height="24" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="285" y="16" fill="#c4b5fd" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">COLUMN STORAGE</text>
  </g>
</svg>
