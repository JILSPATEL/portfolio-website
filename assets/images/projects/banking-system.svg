<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad3)"/>

  <!-- Subtle circuit/terminal pattern -->
  <g stroke="rgba(16, 185, 129, 0.08)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <circle cx="200" cy="200" r="140" fill="#10b981" opacity="0.09" filter="url(#glow3)"/>
  <circle cx="600" cy="220" r="130" fill="#3b82f6" opacity="0.09" filter="url(#glow3)"/>

  <!-- Main Terminal Box -->
  <rect x="70" y="55" width="660" height="340" rx="16" fill="#0c1322" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>

  <!-- Terminal Header -->
  <rect x="70" y="55" width="660" height="44" rx="16" fill="#060c18"/>
  <circle cx="98" cy="77" r="5.5" fill="#ef4444"/>
  <circle cx="118" cy="77" r="5.5" fill="#f59e0b"/>
  <circle cx="138" cy="77" r="5.5" fill="#10b981"/>
  <text x="165" y="82" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="13">server/tcp_socket_bank.c • Linux POSIX Sockets • Multi-Threaded</text>

  <!-- Left: Client Server Socket Architecture -->
  <g transform="translate(110, 130)">
    <!-- Client Box -->
    <rect width="135" height="180" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="67" y="30" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">CLIENT NODE</text>
    <rect x="18" y="48" width="100" height="24" rx="4" fill="#0f172a"/>
    <text x="67" y="64" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">socket(AF_INET)</text>
    <rect x="18" y="82" width="100" height="24" rx="4" fill="#0f172a"/>
    <text x="67" y="98" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">connect(IP:PORT)</text>
    <rect x="18" y="116" width="100" height="24" rx="4" fill="#0f172a"/>
    <text x="67" y="132" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">send(TX_REQ)</text>
    <rect x="18" y="148" width="100" height="20" rx="4" fill="#065f46"/>
    <text x="67" y="162" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">RECV ACK</text>
  </g>

  <!-- Middle: TCP Channel -->
  <g transform="translate(265, 180)">
    <line x1="0" y1="20" x2="110" y2="20" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="55" y="12" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">TCP STREAM</text>
    <text x="55" y="38" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Full Duplex</text>
  </g>

  <!-- Right: Server Engine -->
  <g transform="translate(395, 130)">
    <rect width="295" height="180" rx="10" fill="#111c30" stroke="#10b981" stroke-width="1.2"/>
    <text x="20" y="30" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">SERVER CORE &amp; PERSISTENCE</text>
    
    <g transform="translate(20, 50)">
      <rect width="120" height="48" rx="6" fill="#1e293b"/>
      <text x="10" y="20" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">bind() &amp; listen()</text>
      <text x="10" y="38" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10">accept(conn_fd)</text>

      <rect x="135" width="120" height="48" rx="6" fill="#1e293b"/>
      <text x="145" y="20" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">pthread_create()</text>
      <text x="145" y="38" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10">Worker Pool</text>
    </g>

    <g transform="translate(20, 110)">
      <rect width="255" height="50" rx="6" fill="#09101d" stroke="rgba(255,255,255,0.1)"/>
      <text x="12" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">ACID Record Lock: flock(fd, LOCK_EX)</text>
      <text x="12" y="38" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">Atomic Balances • Zero Race Conditions</text>
    </g>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(110, 340)">
    <rect width="70" height="24" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="35" y="16" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">C LANG</text>
    <rect x="80" width="100" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="130" y="16" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">TCP SOCKETS</text>
    <rect x="190" width="80" height="24" rx="12" fill="#1e293b" stroke="#eab308" stroke-width="1"/>
    <text x="230" y="16" fill="#fde047" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">LINUX OS</text>
  </g>
</svg>
